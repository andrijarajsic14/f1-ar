<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 AR Iskustvo - Fakultetski Projekat</title>
    <!-- Učitavanje Google Model Viewera za AR -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    
    <style>
        :root {
            --primary-color: #df0017; /* F1 Crvena */
            --bg-color: #0a0a0a;
            --text-color: #ececec;
            --panel-bg: rgba(20, 20, 20, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* Glavni kontejner za 3D model */
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: block;
        }

        /* Gornji panel sa informacijama */
        .header-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(223, 0, 23, 0.3);
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 10;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-panel h1 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .header-panel h1 span {
            color: var(--primary-color);
        }

        .header-panel p {
            font-size: 11px;
            color: #757575;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Donji panel za opis tačaka na tap */
        .info-panel {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            width: 90%;
            max-width: 450px;
            backdrop-filter: blur(10px);
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translate(-50(), 20px);
            pointer-events: none;
        }

        .info-panel.active {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
        }

        .info-panel h2 {
            font-size: 14px;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .info-panel p {
            font-size: 13px;
            color: #c1c1c1;
            line-height: 1.4;
        }

        /* Stilovi za Interaktivne Hotspot tačke na bolidu */
        .hotspot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background-color: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color), 0 0 20px rgba(223, 0, 23, 0.5);
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .hotspot:not([data-visible]) {
            background: transparent;
            border: 3px solid rgba(255,255,255,0.5);
            box-shadow: none;
            width: 16px;
            height: 16px;
        }

        .hotspot:focus {
            outline: none;
        }

        .hotspot:hover {
            transform: scale(1.2);
        }

        /* Prilagođeno AR dugme na dnu ekrana */
        #ar-button {
            background-color: var(--primary-color);
            border-radius: 30px;
            padding: 12px 35px;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(223, 0, 23, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #ar-button:active {
            background-color: #b30012;
        }

        /* Instrukcije za AR pozicioniranje koje sistem sam pali */
        #ar-prompt {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
        }

        model-viewer[ar-status="session-started"] #ar-prompt {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Gornji info panel -->
    <div class="header-panel">
        <h1>F1 - 2026 <span>Showcase</span></h1>
        <p>Multimedijalni Projekat • Dodirni tačke za detalje</p>
    </div>

    <!-- Glavna 3D/AR Komponenta -->
    <model-viewer 
        src="bolid.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        interaction-prompt="auto"
        shadow-intensity="1.5" 
        shadow-softness="0.8"
        environment-image="neutral"
        auto-rotate
        auto-rotate-delay="3000">
        
        <!-- Dugme za pokretanje AR-a -->
        <button slot="ar-button" id="ar-button">
            🤖 POKRENI AR ISKUSTVO
        </button>

        <!-- Hotspot TAČKA 1: Aero / Prednje krilo -->
        <button class="hotspot" slot="hotspot-aero" 
                data-position="0m 0.3m 2.1m" 
                data-normal="0m 1m 0m" 
                onclick="prikaziInfo('Aerodinamika', 'Prednje krilo generiše potisnu silu (downforce) i usmerava vazdušnu struju oko prednjih točkova kako bi se smanjio otpor vazduha.')">
        </button>

        <!-- Hotspot TAČKA 2: Motor / Pogonska jedinica -->
        <button class="hotspot" slot="hotspot-motor" 
                data-position="0m 0.8m -0.8m" 
                data-normal="0m 1m 0m" 
                onclick="prikaziInfo('Pogonska Jedinica', 'Hibridni V6 turbo motor zapremine 1.6 litara sa naprednim ERS sistemom za rekuperaciju kinetičke i toplotne energije koji isporučuje preko 1000 konjskih snaga.')">
        </button>

        <!-- Hotspot TAČKA 3: Gume / Pneumatici -->
        <button class="hotspot" slot="hotspot-gume" 
                data-position="0.8m 0.4m 1.4m" 
                data-normal="1m 0m 0m" 
                onclick="prikaziInfo('Pneumatici (Slick)', 'Gume bez šare obezbeđuju maksimalnu kontaktnu površinu sa asfaltom. Crveni marker označava soft (meku) komponentu za maksimalno prijanjanje u krivinama.')">
        </button>

    </model-viewer>

    <!-- Dinamički panel koji se otvara na klik neke tačke -->
    <div id="info-panel" class="info-panel">
        <h2 id="info-naslov">Komponenta</h2>
        <p id="info-tekst">Opis selektovanog dela bolida.</p>
    </div>

    <script>
        // Funkcija koja menja tekst u donjem panelu na klik tačke
        function prikaziInfo(naslov, tekst) {
            const panel = document.getElementById('info-panel');
            const naslovElement = document.getElementById('info-naslov');
            const tekstElement = document.getElementById('info-tekst');

            naslovElement.innerText = naslov;
            tekstElement.innerText = tekst;

            // Prikaži panel sa animacijom
            panel.classList.add('active');

            // Automatski sakrij panel nakon 8 sekundi ako korisnik ne klikne ništa drugo
            clearTimeout(window.panelTimeout);
            window.panelTimeout = setTimeout(() => {
                panel.classList.remove('active');
            }, 8000);
        }

        // Zatvori panel ako korisnik klikne bilo gde na 3D model van tačaka
        document.querySelector('model-viewer').addEventListener('click', (e) => {
            if (!e.target.classList.contains('hotspot')) {
                document.getElementById('info-panel').classList.remove('active');
            }
        });
    </script>
</body>
</html>
