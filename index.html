<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 AR Iskustvo - Fakultetski Projekat</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        :root {
            --primary-color: #df0017;
            --bg-color: #0a0a0a;
            --text-color: #ececec;
            --panel-bg: rgba(20, 20, 20, 0.85);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: block;
        }
        .header-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(223, 0, 23, 0.3);
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 10;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            pointer-events: none; /* Da ne smeta u AR-u */
        }
        .header-panel h1 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-color);
        }
        .header-panel h1 span { color: var(--primary-color); }
        .header-panel p {
            font-size: 11px;
            color: #757575;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .info-panel {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            width: 90%;
            max-width: 450px;
            backdrop-filter: blur(10px);
            z-index: 9999; /* Osigurava da je uvek na vrhu, i u AR-u */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
        }
        .info-panel.active {
            opacity: 1;
            transform: translate(-50%, -10px);
            pointer-events: auto;
        }
        .info-panel h2 {
            font-size: 14px;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .info-panel p {
            font-size: 13px;
            color: #c1c1c1;
            line-height: 1.4;
        }
        .hotspot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid white;
            background-color: var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
            cursor: pointer;
            z-index: 9998;
        }
        #ar-button {
            background-color: var(--primary-color);
            border-radius: 30px;
            padding: 14px 35px;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(223, 0, 23, 0.4);
        }
    </style>
</head>
<body>

    <!-- Audio element za zvuk motora -->
    <audio id="f1-zvuk" src="motor.mp3" preload="auto"></audio>

    <div class="header-panel">
        <h1>F1 - 2026 <span>Showcase</span></h1>
        <p>Multimedijalni Projekat • Dodirni tačke</p>
    </div>

    <!-- VAŽNO: ar-modes je podešen da forsira webxr u kojem rade HTML elementi -->
    <model-viewer 
        src="bolid.glb" 
        ar 
        ar-modes="webxr" 
        camera-controls 
        interaction-prompt="auto"
        shadow-intensity="1.5" 
        environment-image="neutral">
        
        <button slot="ar-button" id="ar-button">
            🤖 POKRENI AR ISKUSTVO
        </button>

        <!-- Hotspot Aero -->
        <button class="hotspot" slot="hotspot-aero" 
                data-position="0m 0.3m 2.1m" 
                data-normal="0m 1m 0m" 
                onclick="prikaziInfo('Aerodinamika', 'Prednje krilo generiše downforce i usmerava vazduh oko točkova.', false)">
        </button>

        <!-- Hotspot Motor (ovde palimo zvuk sa "true") -->
        <button class="hotspot" slot="hotspot-motor" 
                data-position="0m 0.8m -0.8m" 
                data-normal="0m 1m 0m" 
                onclick="prikaziInfo('Pogonska Jedinica', 'Hibridni V6 turbo motor sa preko 1000 KS. Slušaj taj zvuk!', true)">
        </button>

        <!-- Hotspot Gume -->
        <button class="hotspot" slot="hotspot-gume" 
                data-position="0.8m 0.4m 1.4m" 
                data-normal="1m 0m 0m" 
                onclick="prikaziInfo('Pneumatici', 'Soft komponenta guma za maksimalno prijanjanje na stazi.', false)">
        </button>

    </model-viewer>

    <div id="info-panel" class="info-panel">
        <h2 id="info-naslov">Komponenta</h2>
        <p id="info-tekst">Opis.</p>
    </div>

    <script>
        function prikaziInfo(naslov, tekst, pustiZvuk) {
            const panel = document.getElementById('info-panel');
            const naslovElement = document.getElementById('info-naslov');
            const tekstElement = document.getElementById('info-tekst');
            const audio = document.getElementById('f1-zvuk');

            naslovElement.innerText = naslov;
            tekstElement.innerText = tekst;
            panel.classList.add('active');

            // Ako je kliknut motor, pusti zvuk ispočetka
            if (pustiZvuk) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio blokiran dok ne tapneš ekran:", e));
            }

            clearTimeout(window.panelTimeout);
            window.panelTimeout = setTimeout(() => {
                panel.classList.remove('active');
            }, 8000);
        }

        document.querySelector('model-viewer').addEventListener('click', (e) => {
            if (!e.target.classList.contains('hotspot')) {
                document.getElementById('info-panel').classList.remove('active');
            }
        });
    </script>
</body>
</html>
