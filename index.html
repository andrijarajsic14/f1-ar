<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 AR Iskustvo - Fakultetski Projekat</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
    <style>
        :root {
            --primary-color: #df0017;
            --bg-color: #0a0a0a;
            --text-color: #ececec;
            --panel-bg: rgba(20, 20, 20, 0.95);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: block;
        }
        .header-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(223, 0, 23, 0.3);
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 9000;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header-panel h1 {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-color);
        }
        .header-panel h1 span { color: var(--primary-color); }
        .header-panel p {
            font-size: 11px;
            color: #b0b0b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .info-panel {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
            border-top: 1px solid rgba(255,255,255,0.1);
            width: 90%;
            max-width: 450px;
            backdrop-filter: blur(10px);
            z-index: 9999 !important; /* Osigurava da panel iskače ispred svega u AR-u */
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            opacity: 0;
            pointer-events: none;
        }
        .info-panel.active {
            opacity: 1;
            transform: translate(-50%, -10px);
            pointer-events: auto;
        }
        .info-panel h2 {
            font-size: 15px;
            color: var(--primary-color);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .info-panel p {
            font-size: 13px;
            color: #e0e0e0;
            line-height: 1.5;
        }
        .hotspot {
            width: 32px; /* Malo veća površina za lakši klik prstom na kameri */
            height: 32px;
            border-radius: 50%;
            border: 2px solid white;
            background-color: var(--primary-color);
            box-shadow: 0 0 12px var(--primary-color);
            cursor: pointer;
            z-index: 9500 !important;
            pointer-events: auto !important; /* Forsira telefon da uvek registruje klik na tačku */
        }
        #ar-button {
            background-color: var(--primary-color);
            border-radius: 30px;
            padding: 14px 35px;
            color: white;
            border: none;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(223, 0, 23, 0.4);
        }
    </style>
</head>
<body>

    <audio id="f1-zvuk" src="motor.mp3" preload="auto"></audio>

    <div class="header-panel">
        <h1>F1 - Interaktivni AR <span>Projekat</span></h1>
        <p>Istraživanje i razvoj multimedijalnog sadržaja</p>
    </div>

    <!-- ar-modes je podešen da forsira webxr na prvom mestu jer ti on radi -->
    <model-viewer 
        src="bolid.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-placement="floor"
        camera-controls 
        interaction-prompt="auto"
        shadow-intensity="1.5" 
        environment-image="neutral">
        
        <button slot="ar-button" id="ar-button">
            🏎️ POKRENI INTERAKTIVNI AR
        </button>

        <!-- 1. PREDNJE KRILO (Pomereno malo naviše i napred da ne upada u pod/model) -->
        <button class="hotspot" slot="hotspot-aero" 
                data-position="0m 0.35m 2.2m" 
                data-normal="0m 1m 0m" 
                onclick="prikaziInfo('Prednja Aerodinamika (Front Wing)', 'Prednje krilo je ključni element za usmeravanje vazdušne struje. Ono generiše primarni aerodinamički potisak (downforce) koji lepi prednji deo bolida za stazu, omogućavajući maksimalnu stabilnost i brzinu pri ulaženju u oštre krivine.', false)">
        </button>

        <!-- 2. HIBRIDNI MOTOR (Provereno radi) -->
        <button class="hotspot" slot="hotspot-motor" 
                data-position="0m 0.85m -0.8m" 
                data-normal="0m 1m 0m" 
                onclick="prikaziInfo('Pogonska Jedinica (V6 Turbo Hybrid)', 'Srce bolida čini visokorazvijeni 1.6-litarski V6 turbo hibridni motor. Kombinuje klasično unutrašnje sagorevanje sa naprednim sistemima za regeneraciju kinetičke i toplotne energije (MGU-K i MGU-H), isporučujući snagu od preko 1000 konjskih snaga.', true)">
        </button>

        <!-- 3. PNEUMATICI (Izvučeno bočno malo više udesno da bude pristupačno) -->
        <button class="hotspot" slot="hotspot-gume" 
                data-position="0.95m 0.4m 1.4m" 
                data-normal="1m 0m 0m" 
                onclick="prikaziInfo('Pneumatici i Vešanje (Slick Tyres)', 'Trkačke gume bez šara (Slick) projektovane su za maksimalnu kontaktnu površinu i hemijsko prijanjanje sa asfaltom. Uparene su sa kompleksnim sistemom vešanja koji trpi opterećenja bočnih sila većih od 5G tokom trke.', false)">
        </button>

        <!-- 4. HALO SISTEM (Podignuto malo iznad kokpita) -->
        <button class="hotspot" slot="hotspot-halo" 
                data-position="0m 1.05m 0.3m" 
                data-normal="0m 1m 0m" 
                onclick="prikaziInfo('HALO Sigurnosni Sistem', 'Titanijumska struktura težine svega 9 kg koja okružuje kokpit vozača. Konstruisana je sa ciljem da izdrži statičko opterećenje od čak 12 tona (težinu autobusa na sprat) kako bi zaštitila glavu vozača od letećih krhotina i teških incidenata na stazi.', false)">
        </button>

        <!-- 5. ZADNJE KRILO (Podignuto i izvučeno skroz nazad) -->
        <button class="hotspot" slot="hotspot-zadnje" 
                data-position="0m 1.3m -2.0m" 
                data-normal="0m 1m 0m" 
                onclick="prikaziInfo('Zadnje Krilo i DRS Sistem', 'Zadnje krilo balansira potisak zadnje osovine. Uključuje i DRS (Drag Reduction System) – hidraulični mehanizam koji otvara zakrilce na pravcima, čime se drastično smanjuje otpor vazduha i omogućava povećanje maksimalne brzine za oko 10–12 km/h radi lakšeg preticanja.', false)">
        </button>

        <div id="info-panel" class="info-panel">
            <h2 id="info-naslov">Komponenta</h2>
            <p id="info-tekst">Opis.</p>
        </div>

    </model-viewer>

    <script>
        function prikaziInfo(naslov, tekst, pustiZvuk) {
            const panel = document.getElementById('info-panel');
            const naslovElement = document.getElementById('info-naslov');
            const tekstElement = document.getElementById('info-tekst');
            const audio = document.getElementById('f1-zvuk');

            naslovElement.innerText = naslov;
            tekstElement.innerText = tekst;
            panel.classList.add('active');

            if (pustiZvuk) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log("Audio block:", e));
            }

            clearTimeout(window.panelTimeout);
            window.panelTimeout = setTimeout(() => {
                panel.classList.remove('active');
            }, 9000); // 9 sekundi traje prikaz
        }

        // Zatvaranje panela ako se klikne bilo gde van hotspotova
        document.querySelector('model-viewer').addEventListener('click', (e) => {
            if (!e.target.classList.contains('hotspot')) {
                document.getElementById('info-panel').classList.remove('active');
            }
        });
    </script>
</body>
</html>
